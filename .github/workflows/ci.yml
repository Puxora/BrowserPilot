name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: orchestrator/global.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:tools
      - run: npm run check:native-host
      - run: npm audit --package-lock-only --audit-level=moderate
      - run: npm pack --dry-run
